; tds+ ability config — one rule per line:  <name or asset id> = <mode>
; modes:
;   spam        press whenever ready (default for everything not listed)
;   chain <sec> at most one press per <sec> seconds across the shared button
;               (for buff abilities: commander CTA etc.)
;   off         never auto-press
;
; names resolve through the id table below; direct asset id always works.
; the slot list on start prints:  slot[F] id=4594880289 "Call to Arms" (chain 10s)
;
; =================== RULES (edit these) ===================

Commander/Call to Arms = chain 10
DJ Booth/Drop the Beat = spam
Medic/Ubercharge = spam
Enforcer/SWAT Van = spam
Kingpin/Bounty = off      ; repeating its key does nothing useful; switch on only if you want it pressed

