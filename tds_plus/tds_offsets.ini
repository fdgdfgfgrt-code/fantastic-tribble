; tds+ offsets updater settings.
;
; Roblox changes its memory layout with every client update. For a client version the program has no
; offsets for, it downloads the public offsets table once (a single HTTPS request to the address below),
; accepts it only if it is for exactly that version, and saves the offsets to tds_offsets_cache.ini after
; they have worked (the game data was found with them).
;
; auto_update = off   never go online; an unknown version then shows "Unknown Roblox version" and needs
;                     a new row in src rbx_offsets.hpp instead
auto_update = on

; another table in the same C++ header format (https only)
; source = https://offsets.imtheo.lol/Offsets.hpp
